<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monthly Payslip - HCM Lite</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app-container">
      <aside class="sidebar" id="appSidebar">
        <div class="sidebar-header">
          <a href="admin.html" class="brand-badge" id="sidebarBrandLink">
            <div class="brand-icon">⚡</div>
            <div>
              <div class="brand-text">HCM Lite</div>
              <span class="brand-subtitle company-name-display">Acme Corp</span>
            </div>
          </a>
          <button type="button" class="sidebar-close-btn" id="sidebarCloseBtn">
            &times;
          </button>
        </div>

        <nav class="sidebar-nav" id="sidebarNavLinks"></nav>

        <div class="sidebar-footer">
          <div class="user-profile-summary">
            <div class="user-avatar" id="navAvatar">US</div>
            <div class="user-info-text">
              <div class="user-name" id="navUserName">User</div>
              <div class="user-role-badge" id="navUserRole">Role</div>
            </div>
          </div>
        </div>
      </aside>

      <div class="main-wrapper">
        <header class="topbar">
          <div class="topbar-left">
            <button type="button" class="mobile-menu-btn" id="mobileMenuBtn">
              ☰
            </button>
            <h1 class="page-title">Monthly Payroll Statement</h1>
          </div>
          <div class="topbar-right">
            <button
              type="button"
              class="btn btn-outline btn-sm theme-toggle-btn"
            >
              <span class="icon">🌙</span>
              <span class="theme-text">Dark Mode</span>
            </button>
            <button type="button" class="btn btn-outline btn-sm logout-btn">
              🚪 Sign Out
            </button>
          </div>
        </header>

        <main class="page-content">
          <div class="card no-print" style="margin-bottom: 1.5rem">
            <div class="card-body" style="padding: 1.25rem">
              <div
                style="
                  display: flex;
                  gap: 1rem;
                  flex-wrap: wrap;
                  align-items: flex-end;
                  justify-content: space-between;
                "
              >
                <div style="display: flex; gap: 1rem; flex-wrap: wrap; flex: 1">
                  <div
                    class="form-group"
                    id="payslipEmployeeSelectorGroup"
                    style="margin-bottom: 0; min-width: 250px"
                  >
                    <label class="form-label" for="payslipEmployeeSelect"
                      >Select Employee</label
                    >
                    <select
                      id="payslipEmployeeSelect"
                      class="form-control"
                    ></select>
                  </div>

                  <div
                    class="form-group"
                    style="margin-bottom: 0; min-width: 150px"
                  >
                    <label class="form-label" for="payslipMonthSelect"
                      >Payroll Month</label
                    >
                    <select id="payslipMonthSelect" class="form-control">
                      <option value="1">January</option>
                      <option value="2">February</option>
                      <option value="3">March</option>
                      <option value="4">April</option>
                      <option value="5">May</option>
                      <option value="6">June</option>
                      <option value="7">July</option>
                      <option value="8">August</option>
                      <option value="9">September</option>
                      <option value="10">October</option>
                      <option value="11">November</option>
                      <option value="12">December</option>
                    </select>
                  </div>

                  <div
                    class="form-group"
                    style="margin-bottom: 0; min-width: 120px"
                  >
                    <label class="form-label" for="payslipYearSelect"
                      >Payroll Year</label
                    >
                    <select
                      id="payslipYearSelect"
                      class="form-control"
                    ></select>
                  </div>
                </div>

                <div>
                  <button
                    type="button"
                    class="btn btn-primary"
                    id="printPayslipBtn"
                  >
                    🖨️ Print / Save as PDF
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div id="payslipDocumentContainer"></div>

          <div id="payslipEmptyState" class="empty-state" style="display: none">
            <div class="empty-state-icon">📄</div>
            <div class="empty-state-title">No Payslip Available</div>
            <p class="empty-state-text">
              Please select an employee and payroll period to generate the
              official salary slip.
            </p>
          </div>
        </main>
      </div>
    </div>

    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/attendance.js"></script>
    <script src="../js/leave.js"></script>
    <script src="../js/payslip.js"></script>
    <script src="../js/helper.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (!AuthService.requireAuth("any")) return;

        const session = AuthService.getSession();
        const company = StorageService.getCompany() || {};

        const companyDisplays = document.querySelectorAll(
          ".company-name-display",
        );
        companyDisplays.forEach(
          (el) => (el.textContent = company.companyName || "Acme Corp"),
        );

        if (session) {
          document.getElementById("navUserName").textContent = session.fullName;
          document.getElementById("navUserRole").textContent =
            session.role === "admin" ? "Administrator" : "Staff Employee";
          const initials = session.fullName
            .split(" ")
            .map((n) => n[0])
            .join("")
            .substring(0, 2)
            .toUpperCase();
          document.getElementById("navAvatar").textContent = initials;
        }

        const navContainer = document.getElementById("sidebarNavLinks");
        const brandLink = document.getElementById("sidebarBrandLink");

        if (session.role === "admin") {
          brandLink.href = "admin.html";
          navContainer.innerHTML = `
          <div class="nav-section-title">Main Menu</div>
          <a href="admin.html" class="nav-item">
            <span class="icon">📊</span>
            <span>Dashboard</span>
          </a>
          <a href="employees.html" class="nav-item">
            <span class="icon">👥</span>
            <span>Manage Employees</span>
          </a>
          <a href="leaves.html" class="nav-item">
            <span class="icon">📅</span>
            <span>Leave Requests</span>
          </a>
          <a href="payslip.html" class="nav-item active">
            <span class="icon">💰</span>
            <span>Monthly Payslips</span>
          </a>
          <a href="settings.html" class="nav-item">
            <span class="icon">⚙️</span>
            <span>Company Settings</span>
          </a>
        `;
        } else {
          brandLink.href = "employee.html";
          navContainer.innerHTML = `
          <div class="nav-section-title">Self-Service</div>
          <a href="employee.html" class="nav-item">
            <span class="icon">👤</span>
            <span>My Portal</span>
          </a>
          <a href="payslip.html" class="nav-item active">
            <span class="icon">💰</span>
            <span>My Payslip</span>
          </a>
        `;
        }

        PayslipModule.init();

        const mobileBtn = document.getElementById("mobileMenuBtn");
        const sidebarCloseBtn = document.getElementById("sidebarCloseBtn");
        const sidebar = document.getElementById("appSidebar");

        mobileBtn?.addEventListener("click", () =>
          sidebar.classList.add("open"),
        );
        sidebarCloseBtn?.addEventListener("click", () =>
          sidebar.classList.remove("open"),
        );
      });
    </script>
  </body>
</html>

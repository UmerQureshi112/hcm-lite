<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09122c">
  <meta name="description" content="HCM Lite - Human Capital Management, employee attendance, leave management and payroll.">

  <title>HCM Lite | Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <!-- Storage must load before authentication -->
  <script src="js/storage.js"></script>
  <script src="js/theme.js" defer></script>
  <script src="js/auth.js"></script>
</head>

<body>
  <main class="auth-layout">
    <section class="auth-card card">
      <div class="auth-brand">
        <div class="brand-icon" aria-hidden="true">H</div>
        <div>
          <h1>HCM Lite</h1>
          <p class="muted">Human Capital Management</p>
        </div>
      </div>

      <div class="auth-heading">
        <h2>Welcome to HCM Lite</h2>
        <p class="muted">Manage your workforce in one place.</p>
      </div>

      <!-- First-time company and admin setup -->
      <section id="setupSection" hidden>
        <h3>Set up your company</h3>
        <p class="muted">Create your company and administrator account to get started.</p>

        <form id="setupForm">
          <div class="form-group">
            <label for="companyName">Company name</label>
            <input
              type="text"
              id="companyName"
              name="companyName"
              placeholder="Enter company name"
              autocomplete="organization"
              required
            >
          </div>

          <div class="form-group">
            <label for="adminName">Administrator name</label>
            <input
              type="text"
              id="adminName"
              name="adminName"
              placeholder="Enter your full name"
              autocomplete="name"
              required
            >
          </div>

          <div class="form-group">
            <label for="adminEmail">Administrator email</label>
            <input
              type="email"
              id="adminEmail"
              name="adminEmail"
              placeholder="admin@example.com"
              autocomplete="email"
              required
            >
          </div>

          <div class="form-group">
            <label for="adminPassword">Password</label>
            <input
              type="password"
              id="adminPassword"
              name="adminPassword"
              placeholder="At least 6 characters"
              minlength="6"
              autocomplete="new-password"
              required
            >
          </div>

          <p id="setupError" class="form-error" role="alert" aria-live="polite"></p>

          <button type="submit" class="btn btn-primary btn-block">
            Create Company &amp; Admin
          </button>
        </form>
      </section>

      <!-- Login after initial setup -->
      <section id="loginSection" hidden>
        <h3>Sign in to your account</h3>
        <p class="muted">Enter your credentials to continue.</p>

        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              autocomplete="username"
              required
            >
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
          </div>

          <p id="loginError" class="form-error" role="alert" aria-live="polite"></p>

          <button type="submit" class="btn btn-primary btn-block">
            Sign In
          </button>
        </form>
      </section>

      <footer class="auth-footer">
        <p class="muted">HCM Lite · Employee Management System</p>
      </footer>
    </section>
  </main>

  <script>
  document.addEventListener("DOMContentLoaded", function () {
    const setup = document.getElementById("setupSection");
    const login = document.getElementById("loginSection");

    const admin = localStorage.getItem("hcm_admin");

    if (admin) {
      login.hidden = false;
      setup.hidden = true;
    } else {
      setup.hidden = false;
      login.hidden = true;
    }
  });
</script>
</body>
</html>
